<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRIN135: Todo App</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <h1>Todo List</h1>

        <form id="todo-form" class="todo-form">
            <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="200" required />
            <input id="hours-input" class="hours-input" type="number" min="0" step="0.25" placeholder="Hours" />
            <button type="submit">Add</button>
        </form>

        <div class="toolbar">
            <div class="filters">
                <button type="button" class="filter active" data-filter="all">All</button>
                <button type="button" class="filter" data-filter="active">Active</button>
                <button type="button" class="filter" data-filter="completed">Completed</button>
            </div>
            <button type="button" id="toggle-all" class="link-btn">Mark all done</button>
        </div>

        <ul id="todo-list" class="todo-list">
            <li class="todo-item">
                <input type="checkbox">
                <span class="todo-text">Task 1</span>
                <span class="difficulty difficulty-easy">Easy · 1h</span>
                <button type="button" class="delete-btn">x</button>
            </li>
            <li class="todo-item completed">
                <input type="checkbox" checked>
                <span class="todo-text">Task 2</span>
                <span class="difficulty difficulty-medium">Medium · 2.5h</span>
                <button type="button" class="delete-btn">x</button>
            </li>
            <li class="todo-item">
                <input type="checkbox">
                <span class="todo-text">Task 3</span>
                <span class="difficulty difficulty-hard">Hard · 6h</span>
                <button type="button" class="delete-btn">x</button>
            </li>
        </ul>

        <footer class="footer">
            <span id="todo-count"></span>
            <button type="button" id="clear-completed" class="link-btn">Clear completed</button>
        </footer>

        <p class="hint">
            Easy: up to 2h | Medium: over 2h | Hard: over 5h.<br />
            Double-click a task or its label to edit the text or hours. Press Enter to save, Esc to cancel.
        </p>
    </main>
</body>

</html>
