
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRIN135: Todo App</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Connect JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app">
        <h1>Todo List</h1>

        <!-- Add Todo Form -->
        <form id="todo-form" class="todo-form">
            <input
                id="todo-input"
                type="text"
                placeholder="What needs to be done?"
                maxlength="200"
                required
            />

            <input
                id="hours-input"
                class="hours-input"
                type="number"
                min="0"
                step="0.25"
                placeholder="Hours"
                value="0"
            />

            <button type="submit">Add</button>
        </form>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="filters">
                <button type="button" class="filter active" data-filter="all">
                    All
                </button>

                <button type="button" class="filter" data-filter="active">
                    Active
                </button>

                <button type="button" class="filter" data-filter="completed">
                    Completed
                </button>
            </div>

            <button type="button" id="toggle-all" class="link-btn">
                Mark all done
            </button>
        </div>

        <!-- Todo List -->
        <ul id="todo-list" class="todo-list">
            <!-- Tasks will be generated by JavaScript -->
        </ul>

        <!-- Footer -->
        <footer class="footer">
            <span id="todo-count"></span>

            <button
                type="button"
                id="clear-completed"
                class="link-btn"
            >
                Clear completed
            </button>
        </footer>

        <!-- Instructions -->
        <p class="hint">
            Easy: up to 2h | Medium: over 2h | Hard: over 5h.
            <br />
            Double-click a task or its label to edit the text or hours.
            Press Enter to save, Esc to cancel.
        </p>

    </main>
</body>

</html>
